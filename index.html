<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Metadata Inspector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header h1 { color: #fff; font-size: 2rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
        .header p { color: #a0aec0; font-size: 0.95rem; }
        .header .icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }

        .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }

        .input-section {
            background: #fff; border-radius: 16px; padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px;
        }
        .input-label {
            font-size: 0.85rem; font-weight: 600; color: #718096;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: block;
        }
        .input-row { display: flex; gap: 12px; align-items: stretch; }
        .url-input {
            flex: 1; padding: 14px 18px; border: 2px solid #e2e8f0;
            border-radius: 10px; font-size: 0.95rem; outline: none;
            transition: all 0.3s ease; color: #2d3748; background: #f8fafc;
        }
        .url-input:focus { border-color: #00d4aa; background: #fff; box-shadow: 0 0 0 4px rgba(0,212,170,0.1); }
        .url-input.error { border-color: #fc8181; background: #fff5f5; }

        .analyze-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #00d4aa, #00b4d8);
            color: #fff; border: none; border-radius: 10px; font-size: 0.95rem;
            font-weight: 700; cursor: pointer; transition: all 0.3s ease;
            white-space: nowrap; letter-spacing: 0.5px;
        }
        .analyze-btn:hover { background: linear-gradient(135deg, #00b4d8, #00d4aa); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,170,0.4); }
        .analyze-btn:active { transform: translateY(0); }
        .analyze-btn:disabled { background: #cbd5e0; cursor: not-allowed; transform: none; box-shadow: none; }

        .error-msg { color: #e53e3e; font-size: 0.83rem; margin-top: 8px; display: none; align-items: center; gap: 5px; }
        .error-msg.show { display: flex; }
        .hint-text { color: #a0aec0; font-size: 0.83rem; margin-top: 10px; text-align: center; }

        .loading { display: none; text-align: center; padding: 50px 20px; }
        .loading.show { display: block; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #e2e8f0;
            border-top: 4px solid #00d4aa; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #718096; font-size: 0.95rem; }

        .error-alert {
            display: none; background: #fff5f5; border: 1px solid #feb2b2;
            border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; color: #c53030;
        }
        .error-alert.show { display: block; }

        .results { display: none; }
        .results.show { display: block; }

        .view-toggle {
            display: flex; background: #e2e8f0; border-radius: 10px;
            padding: 4px; margin-bottom: 24px; width: fit-content;
        }
        .toggle-btn {
            padding: 8px 20px; border: none; background: transparent;
            border-radius: 7px; font-size: 0.88rem; font-weight: 600;
            cursor: pointer; color: #718096; transition: all 0.2s ease;
        }
        .toggle-btn.active { background: #fff; color: #2d3748; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* ── Compatibility Table ── */
        .compat-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 22px;
            overflow: hidden;
        }
        .compat-header {
            padding: 16px 22px;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: #fff; font-weight: 700; font-size: 0.95rem;
            display: flex; align-items: center; gap: 10px;
        }
        .compat-table { width: 100%; border-collapse: collapse; }
        .compat-table thead tr { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        .compat-table th {
            padding: 11px 22px; font-size: 0.78rem; font-weight: 700;
            color: #a0aec0; text-transform: uppercase; letter-spacing: 0.5px; text-align: left;
        }
        .compat-table td {
            padding: 14px 22px; font-size: 0.9rem; color: #2d3748;
            border-bottom: 1px solid #f0f4f8; vertical-align: middle;
        }
        .compat-table tr:last-child td { border-bottom: none; }
        .compat-table tbody tr:hover { background: #f8fafc; }

        .compat-type-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 20px; font-size: 0.78rem;
            font-weight: 700; text-transform: uppercase;
        }
        .compat-type-video { background: #ebf8ff; color: #2b6cb0; }
        .compat-type-audio { background: #f0fff4; color: #276749; }

        .compat-value { font-weight: 600; color: #2d3748; }
        .compat-detail { font-size: 0.8rem; color: #718096; margin-top: 2px; }

        .chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 14px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 700; letter-spacing: 0.3px; white-space: nowrap;
        }
        .chip-valid   { background: #c6f6d5; color: #22543d; border: 1.5px solid #9ae6b4; }
        .chip-warning { background: #fefcbf; color: #744210; border: 1.5px solid #f6e05e; }
        .chip-error   { background: #fed7d7; color: #742a2a; border: 1.5px solid #fc8181; }
        .chip-na      { background: #e2e8f0; color: #718096; border: 1.5px solid #cbd5e0; }

        .stream-ref-tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 12px; font-size: 0.75rem;
            font-weight: 600; background: #e2e8f0; color: #4a5568;
        }

        /* ── Stats Grid ── */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card {
            background: #fff; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-left: 4px solid #00d4aa;
            transition: transform 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card:nth-child(2) { border-left-color: #667eea; }
        .stat-card:nth-child(3) { border-left-color: #f6ad55; }
        .stat-card:nth-child(4) { border-left-color: #fc8181; }
        .stat-label { font-size: 0.75rem; font-weight: 700; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: 800; color: #2d3748; }

        .format-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }

        /* ── Collapsible Sections ── */
        .collapsible-card {
            background: #fff; border-radius: 12px; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden;
        }
        .collapsible-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px; cursor: pointer; user-select: none; transition: background 0.2s ease;
        }
        .collapsible-header:hover { background: #f8fafc; }
        .collapsible-header.open { background: linear-gradient(135deg, #00d4aa, #00b4d8); }
        .collapsible-header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .collapsible-icon { font-size: 1.3rem; }
        .collapsible-title { font-weight: 700; font-size: 1rem; color: #2d3748; }
        .collapsible-header.open .collapsible-title { color: #fff; }

        .stream-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-video    { background: #ebf8ff; color: #2b6cb0; }
        .badge-audio    { background: #f0fff4; color: #276749; }
        .badge-subtitle { background: #fefcbf; color: #744210; }
        .badge-data     { background: #faf5ff; color: #553c9a; }
        .badge-format   { background: #e9d8fd; color: #553c9a; }
        .collapsible-header.open .stream-badge { background: rgba(255,255,255,0.25); color: #fff; }

        .chevron { font-size: 1rem; color: #a0aec0; transition: transform 0.3s ease; }
        .collapsible-header.open .chevron { transform: rotate(180deg); color: #fff; }

        .collapsible-body { display: none; border-top: 1px solid #f0f4f8; }
        .collapsible-body.open { display: block; }

        .format-details-header-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px; cursor: pointer; user-select: none;
            transition: background 0.2s ease;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .format-details-header-bar .collapsible-title { color: #fff; }
        .format-details-header-bar .chevron { color: rgba(255,255,255,0.7); }
        .format-details-header-bar .chevron.rotated { transform: rotate(180deg); color: #fff; }

        .stream-row {
            display: flex; justify-content: space-between;
            padding: 14px 22px; border-bottom: 1px solid #f7f9fc; transition: background 0.15s;
        }
        .stream-row:last-child { border-bottom: none; }
        .stream-row:hover { background: #f8fafc; }
        .row-label { font-size: 0.88rem; color: #718096; font-weight: 500; min-width: 180px; }
        .row-value {
            font-size: 0.88rem; color: #2d3748; font-weight: 600;
            text-align: right; word-break: break-all;
            display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
        }

        .section-divider {
            padding: 10px 22px 6px; font-size: 0.78rem; font-weight: 700;
            color: #a0aec0; text-transform: uppercase; letter-spacing: 0.5px;
            background: #f8fafc; border-top: 1px solid #f0f4f8; border-bottom: 1px solid #f0f4f8;
        }

        .disposition-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 16px 22px; }
        .disposition-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
        .disposition-dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-active   { background: #48bb78; }
        .dot-inactive { background: #e2e8f0; }

        /* ── JSON View ── */
        .json-view { background: #1a202c; border-radius: 12px; padding: 24px; overflow-x: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .json-view pre { font-family: 'Courier New', monospace; font-size: 0.83rem; line-height: 1.7; color: #e2e8f0; white-space: pre-wrap; word-break: break-all; }
        .json-key     { color: #81e6d9; }
        .json-string  { color: #fbd38d; }
        .json-number  { color: #90cdf4; }
        .json-boolean { color: #fc8181; }
        .json-null    { color: #a0aec0; }

        .file-url-bar {
            background: #edf2f7; border-radius: 8px; padding: 10px 16px;
            font-size: 0.8rem; color: #4a5568; word-break: break-all;
            margin-bottom: 20px; display: flex; align-items: flex-start; gap: 8px;
        }

        /* ── Banners ── */
        .compat-warning-banner {
            display: flex; align-items: flex-start; gap: 12px;
            background: #fff8e1; border: 1.5px solid #f6c90e;
            border-radius: 10px; padding: 14px 18px; font-size: 0.87rem; color: #7a4f00;
        }
        .compat-warning-banner .warn-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
        .compat-warning-banner strong { display: block; margin-bottom: 3px; font-size: 0.9rem; }

        .compat-error-banner {
            display: flex; align-items: flex-start; gap: 12px;
            background: #fff5f5; border: 1.5px solid #fc8181;
            border-radius: 10px; padding: 14px 18px; font-size: 0.87rem; color: #742a2a;
        }
        .compat-error-banner .warn-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
        .compat-error-banner strong { display: block; margin-bottom: 3px; font-size: 0.9rem; }

        .banners-wrap { display: flex; flex-direction: column; gap: 10px; padding: 16px 22px; }

        .download-btn {
    padding: 14px 28px;
    background: #cbd5e0;
    color: #718096;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: not-allowed;
    transition: all 0.3s ease;
    white-space: nowrap;
    letter-spacing: 0.5px;
}

.download-btn:not(:disabled) {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    cursor: pointer;
}

.download-btn:not(:disabled):hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(102,126,234,0.4);
}

.download-btn:active:not(:disabled) {
    transform: translateY(0);
}

.download-btn:disabled {
    opacity: 0.7;
}


        @media (max-width: 600px) {
            .input-row { flex-direction: column; }
            .analyze-btn { width: 100%; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 1.5rem; }
            .stat-value { font-size: 1.2rem; }
            .compat-table th, .compat-table td { padding: 10px 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <span class="icon">🎬</span>
    <h1>Media Metadata Inspector</h1>
    <p>Analyze video, audio, and image file metadata instantly</p>
</div>

<div class="container">

    <div class="input-section">
        <label class="input-label">Media File URL</label>
        <div class="input-row">
            <input type="text" class="url-input" id="urlInput"
                placeholder="https://example.com/video.mp4"
                autocomplete="off" spellcheck="false" />
            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeMedia()">🔍 Analyze</button>
            <button class="download-btn" id="downloadBtn" onclick="downloadVideo()" disabled>⬇️ Download</button>
        </div>
        <div class="error-msg" id="errorMsg">
            <span>⚠️</span><span id="errorText">Please enter a valid HTTPS URL.</span>
        </div>
        <p class="hint-text">Enter a direct URL to any video, audio, or image file to inspect its metadata</p>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Analyzing media file...</p>
    </div>

    <div class="error-alert" id="apiError">
        <strong>⚠️ Error:</strong> <span id="apiErrorText"></span>
    </div>

    <div class="results" id="results">

        <div class="file-url-bar" id="fileUrlBar">
            <span>🔗</span><span id="fileUrlText"></span>
        </div>

        <div class="view-toggle">
            <button class="toggle-btn active" id="formattedBtn" onclick="switchView('formatted')">📋 Formatted View</button>
            <button class="toggle-btn" id="jsonBtn" onclick="switchView('json')">{ } JSON View</button>
        </div>

        <div id="formattedView">

            <!-- ① Compatibility Table -->
            <div class="compat-card" id="compatCard"></div>

            <!-- ② Stats -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- ③ Format summary -->
            <div class="format-card" id="formatCard"></div>

            <!-- ④ Streams -->
            <div id="streamsSection"></div>

            <!-- ⑤ Format Details collapsible -->
            <div class="collapsible-card" id="formatDetailsCard"></div>

        </div>

        <div id="jsonView" style="display:none;">
            <div class="json-view"><pre id="jsonPre"></pre></div>
        </div>

    </div>
</div>

<script>

/* ══════════════════════════════════════════════════════════════════
   AUDIO CLASSIFICATION
══════════════════════════════════════════════════════════════════ */
const STANDARD_CODECS = new Set([
    'aac', 'aac2.0', 'mp3', 'mp2', 'mp2float',
    'opus', 'vorbis', 'flac',
    'alac', 'pcm_s16le', 'pcm_s24le', 'pcm_s32le',
    'pcm_f32le', 'pcm_u8', 'pcm_alaw', 'pcm_mulaw',
    'wmav2', 'wmav1', 'amrnb', 'amrwb',
    'speex', 'gsm', 'adpcm_ima_wav', 'adpcm_ms'
]);

const SURROUND_CODECS = new Set([
    'ac3', 'eac3', 'truehd', 'mlp',
    'dts', 'dtshd', 'dca',
    'atmos', 'dolby_atmos',
    'dolby_digital', 'dolby_digital_plus'
]);

const SURROUND_LAYOUTS = [
    '5.1', '7.1', '6.0', '6.1', '7.0',
    '5.1(side)', '7.1(wide)', '5.1(back)',
    'hexagonal', 'octagonal', 'downmix'
];

function classifyAudioStream(stream) {
    const codec    = (stream.codec_name     || '').toLowerCase().trim();
    const profile  = (stream.profile        || '').toLowerCase().trim();
    const layout   = (stream.channel_layout || '').toLowerCase().trim();
    const channels = stream.channels || 0;

    if (STANDARD_CODECS.has(codec)) return 'valid';
    if ((codec === 'ac3' || codec === 'eac3') && channels <= 2) return 'valid';
    if (SURROUND_CODECS.has(codec)) return 'surround';

    const isSurroundLayout = SURROUND_LAYOUTS.some(l => layout.includes(l));
    if (isSurroundLayout || channels > 2) return 'surround';

    if (profile.includes('dolby') || profile.includes('atmos') ||
        codec.includes('dolby')   || codec.includes('atmos')) {
        return 'surround';
    }

    if (channels > 0 && channels <= 2) return 'valid';

    return 'unknown';
}

function audioStreamLabel(stream) {
    const codec     = (stream.codec_name || '').toUpperCase();
    const layout    = stream.channel_layout || '';
    const channels  = stream.channels || '';
    const codecLong = stream.codec_long_name || '';
    const parts = [codecLong || codec];
    if (layout) parts.push(layout);
    else if (channels) parts.push(`${channels}ch`);
    return parts.join(' · ');
}

function getAudioValidity(streams) {
    const audioStreams = streams.filter(s => s.codec_type === 'audio');
    if (!audioStreams.length) return { overall: 'no-audio', streams: [] };

    const classified = audioStreams.map(s => ({ stream: s, status: classifyAudioStream(s) }));
    const hasValid = classified.some(c => c.status === 'valid');

    return { overall: hasValid ? 'valid' : 'invalid', streams: classified };
}

/* ══════════════════════════════════════════════════════════════════
   VALIDATION
══════════════════════════════════════════════════════════════════ */
function isValidHttpsUrl(str) {
    try { const u = new URL(str); return u.protocol === 'https:'; }
    catch { return false; }
}
function showInputError(msg) {
    document.getElementById('urlInput').classList.add('error');
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMsg').classList.add('show');
}
function clearInputError() {
    document.getElementById('urlInput').classList.remove('error');
    document.getElementById('errorMsg').classList.remove('show');
}

/* ══════════════════════════════════════════════════════════════════
   MAIN
══════════════════════════════════════════════════════════════════ */
async function analyzeMedia() {
    const url = document.getElementById('urlInput').value.trim();

    // Reset download state for every new analysis
    analyzedVideoUrl = null;
    document.getElementById('downloadBtn').disabled = true;

    clearInputError();
    document.getElementById('results').classList.remove('show');
    document.getElementById('apiError').classList.remove('show');

    if (!url) {
        showInputError('Please enter a URL to analyze.');
        return;
    }

    if (!url.startsWith('https://')) {
        showInputError('URL must start with https://. Only secure HTTPS URLs are supported.');
        return;
    }

    if (!isValidHttpsUrl(url)) {
        showInputError('Please enter a valid HTTPS URL (e.g., https://example.com/video.mp4).');
        return;
    }

    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Analyzing...';
    document.getElementById('loading').classList.add('show');

    try {
        const res = await fetch(
            `https://api.shotstack.io/v1/probe/${encodeURIComponent(url)}`
        );

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || `HTTP ${res.status}`);
        }

        renderResults(data, url);

        // Successful analysis → enable download
        analyzedVideoUrl = url;
        document.getElementById('downloadBtn').disabled = false;

    } catch(err) {
        document.getElementById('apiErrorText').textContent =
            err.message || 'Failed to fetch media metadata.';

        document.getElementById('apiError').classList.add('show');

    } finally {
        document.getElementById('loading').classList.remove('show');
        btn.disabled = false;
        btn.textContent = '🔍 Analyze';
    }
}

function downloadVideo() {
    if (!analyzedVideoUrl) return;

    const a = document.createElement('a');
    a.href = analyzedVideoUrl;
    a.download = analyzedVideoUrl.split('/').pop().split('?')[0] || 'video.mp4';
    a.target = '_blank';
    a.rel = 'noopener';

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}


/* ══════════════════════════════════════════════════════════════════
   RENDER ALL
══════════════════════════════════════════════════════════════════ */
function renderResults(data, inputUrl) {
    const meta    = data.response.metadata;
    const format  = meta.format;
    const streams = meta.streams || [];

    document.getElementById('fileUrlText').textContent = format.filename || inputUrl;

    renderCompatTable(streams);
    renderStats(format, streams);
    renderFormatCard(format);
    renderStreams(streams);
    renderFormatDetails(format);

    document.getElementById('jsonPre').innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));
    document.getElementById('results').classList.add('show');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══════════════════════════════════════════════════════════════════
   ① COMPATIBILITY TABLE
══════════════════════════════════════════════════════════════════ */
function renderCompatTable(streams) {
    const videoStream  = streams.find(s => s.codec_type === 'video');
    const audioStreams = streams.filter(s => s.codec_type === 'audio');

    const banners = [];
    let tableRows = '';

    /* ── VIDEO ROW ── */
    if (videoStream) {
        const pf = (videoStream.pix_fmt || '').toLowerCase();
        const validPixFmts = ['yuv420p', 'yuvj420p'];
        const isValidPix   = validPixFmts.includes(pf);
        const chip = pf
            ? (isValidPix
                ? `<span class="chip chip-valid">✔ Valid</span>`
                : `<span class="chip chip-error">✖ Not Valid</span>`)
            : `<span class="chip chip-na">— N/A</span>`;

        tableRows += `
            <tr>
                <td><span class="compat-type-badge compat-type-video">🎬 VIDEO</span></td>
                <td style="font-weight:600;color:#4a5568;">Pixel Format</td>
                <td>
                    <div class="compat-value">${pf || '—'}</div>
                    <div class="compat-detail">${videoStream.codec_long_name || videoStream.codec_name || ''}</div>
                </td>
                <td>${chip}</td>
            </tr>
        `;

        if (!isValidPix && pf) {
            banners.push({
                type: 'error',
                title: 'Unsupported Pixel Format',
                msg: `Pixel format <strong>${pf}</strong> may not be compatible with all players. Recommended: <strong>yuv420p</strong>.`
            });
        }
    }

    /* ── AUDIO ROW(S) ──
       ANY stream = aac / aac2.0 / mp3 / opus / vorbis / flac / stereo-ish  → VALID
       ALL streams = surround-only (Dolby Atmos, Dolby Digital, DTS, 5.1, 7.1, etc.) → INVALID
    ─────────────────────────────────────────────────────────── */
    if (audioStreams.length > 0) {

        const analysed = audioStreams.map((s, i) => {
            const status = classifyAudioStream(s);
            const codec  = (s.codec_name || '').toLowerCase();
            const layout = s.channel_layout || '';
            const channels = s.channels || 0;

            let chip;
            if (status === 'valid') {
                chip = `<span class="chip chip-valid">✔ Compatible</span>`;
            } else if (status === 'surround') {
                chip = `<span class="chip chip-error">✖ Surround Only</span>`;
            } else {
                chip = `<span class="chip chip-warning">? Unknown</span>`;
            }

            const layoutDisplay = layout || (channels ? `${channels}ch` : '');

            return {
                streamIndex: s.index !== undefined ? s.index : i + 1,
                codec: s.codec_long_name || s.codec_name || '—',
                layoutDisplay,
                chip,
                status
            };
        });

        const hasValid   = analysed.some(a => a.status === 'valid');
        const allSurround = analysed.every(a => a.status === 'surround');
        const allUnknown  = analysed.every(a => a.status === 'unknown');

        let overallChip;
        if (hasValid) {
            overallChip = `<span class="chip chip-valid">✔ Compatible Track Found</span>`;
        } else if (allSurround) {
            overallChip = `<span class="chip chip-error">✖ Surround-Only Audio</span>`;
        } else {
            overallChip = `<span class="chip chip-warning">⚠ Unable to Verify</span>`;
        }

        const subRows = analysed.map((a, i) => {
            const isFirst = i === 0;
            return `
                <tr>
                    ${isFirst ? `
                        <td${audioStreams.length > 1 ? ` rowspan="${audioStreams.length}" style="vertical-align:top;padding-top:18px;"` : ''}>
                            <span class="compat-type-badge compat-type-audio">🎵 AUDIO</span>
                        </td>
                        <td${audioStreams.length > 1 ? ` rowspan="${audioStreams.length}" style="vertical-align:top;padding-top:18px;font-weight:600;color:#4a5568;"` : ` style="font-weight:600;color:#4a5568;"`}>
                            Audio Codec
                            ${audioStreams.length > 1 ? `<div style="font-size:0.75rem;color:#a0aec0;font-weight:400;margin-top:2px;">${audioStreams.length} audio tracks</div>` : ''}
                        </td>
                    ` : ''}
                    <td>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            ${audioStreams.length > 1 ? `<span class="stream-ref-tag">Stream ${a.streamIndex}</span>` : ''}
                            <div>
                                <div class="compat-value">${a.codec}</div>
                                ${a.layoutDisplay ? `<div class="compat-detail">Layout: ${a.layoutDisplay}</div>` : ''}
                            </div>
                        </div>
                    </td>
                    <td>${a.chip}</td>
                </tr>
            `;
        }).join('');

        tableRows += subRows;

        if (audioStreams.length > 1) {
            tableRows += `
                <tr style="background:#f8fafc;">
                    <td colspan="2" style="padding:10px 22px;"></td>
                    <td style="padding:10px 22px;font-size:0.82rem;color:#718096;font-weight:600;">
                        Overall Audio Compatibility
                    </td>
                    <td style="padding:10px 22px;">${overallChip}</td>
                </tr>
            `;
        }

        if (allSurround) {
            banners.push({
                type: 'error',
                title: 'No Compatible Audio Track Found',
                msg: `All ${audioStreams.length} audio track${audioStreams.length > 1 ? 's are' : ' is'} surround-only (e.g. Dolby Atmos, Dolby Digital, DTS, 5.1/7.1). Add an <strong>AAC / MP3 stereo</strong> track for broad compatibility.`
            });
        } else if (allUnknown) {
            banners.push({
                type: 'warning',
                title: 'Unable to Verify Audio Compatibility',
                msg: `Could not determine codec compatibility for the audio track(s). Please double-check manually.`
            });
        }

    } else {
        tableRows += `
            <tr>
                <td><span class="compat-type-badge compat-type-audio">🎵 AUDIO</span></td>
                <td style="font-weight:600;color:#4a5568;">Audio Codec</td>
                <td><div class="compat-value" style="color:#a0aec0;">No audio streams found</div></td>
                <td><span class="chip chip-na">— N/A</span></td>
            </tr>
        `;
    }

    let html = `
        <div class="compat-header">🛡️ Compatibility Check</div>
        <table class="compat-table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Property</th>
                    <th>Value / Detail</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                ${tableRows}
            </tbody>
        </table>
    `;

    if (banners.length) {
        html += `<div class="banners-wrap">`;
        banners.forEach(b => {
            const cls = b.type === 'error' ? 'compat-error-banner' : 'compat-warning-banner';
            const ico = b.type === 'error' ? '🚨' : '⚠️';
            html += `
                <div class="${cls}">
                    <span class="warn-icon">${ico}</span>
                    <div><strong>${b.title}</strong>${b.msg}</div>
                </div>
            `;
        });
        html += `</div>`;
    }

    document.getElementById('compatCard').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════
   ② STATS
══════════════════════════════════════════════════════════════════ */
function renderStats(format, streams) {
    const duration    = formatDuration(parseFloat(format.duration));
    const fileSize    = formatFileSize(parseInt(format.size));
    const bitrate     = formatBitrate(parseInt(format.bit_rate));
    const videoStream = streams.find(s => s.codec_type === 'video');
    const resolution  = videoStream ? `${videoStream.width}×${videoStream.height}` : '—';

    document.getElementById('statsGrid').innerHTML = [
        { label:'DURATION',   value:duration,   icon:'⏱️' },
        { label:'FILE SIZE',  value:fileSize,    icon:'💾' },
        { label:'BITRATE',    value:bitrate,     icon:'📶' },
        { label:'RESOLUTION', value:resolution,  icon:'🖥️' },
    ].map(c => `
        <div class="stat-card">
            <div class="stat-label">${c.icon} ${c.label}</div>
            <div class="stat-value">${c.value}</div>
        </div>
    `).join('');
}

/* ══════════════════════════════════════════════════════════════════
   ③ FORMAT CARD
══════════════════════════════════════════════════════════════════ */
function renderFormatCard(format) {
    document.getElementById('formatCard').innerHTML = `
        <div class="stat-label">📁 FORMAT</div>
        <div style="font-size:1.3rem;font-weight:700;color:#2d3748;">${format.format_long_name || format.format_name || '—'}</div>
    `;
}

/* ══════════════════════════════════════════════════════════════════
   ④ STREAMS (default closed)
══════════════════════════════════════════════════════════════════ */
function renderStreams(streams) {
    const container = document.getElementById('streamsSection');
    if (!streams.length) {
        container.innerHTML = '<p style="color:#a0aec0;text-align:center;padding:20px;">No streams found.</p>';
        return;
    }

    container.innerHTML = streams.map((stream, idx) => {
        const type     = stream.codec_type || 'unknown';
        const icon     = getStreamIcon(type);
        const badgeCls = getBadgeClass(type);
        const rows     = buildStreamRows(stream);
        const dispRows = buildDispositionRows(stream.disposition || {});
        const tagRows  = buildTagRows(stream.tags || {});

        let audioBadgeHtml = '';
        if (type === 'audio') {
            const aStatus = classifyAudioStream(stream);
            if (aStatus === 'valid') {
                audioBadgeHtml = `<span class="stream-badge" style="background:#c6f6d5;color:#276749;">✔ Compatible</span>`;
            } else if (aStatus === 'surround') {
                audioBadgeHtml = `<span class="stream-badge" style="background:#fed7d7;color:#742a2a;">✖ Surround Only</span>`;
            } else {
                audioBadgeHtml = `<span class="stream-badge" style="background:#fefcbf;color:#744210;">? Unknown</span>`;
            }
        }

        return `
            <div class="collapsible-card">
                <div class="collapsible-header" onclick="toggleSection('sb-${idx}','sh-${idx}','sc-${idx}')" id="sh-${idx}">
                    <div class="collapsible-header-left">
                        <span class="collapsible-icon">${icon}</span>
                        <span class="collapsible-title">Stream ${idx + 1}</span>
                        <span class="stream-badge ${badgeCls}">${type.toUpperCase()}</span>
                        ${audioBadgeHtml}
                    </div>
                    <span class="chevron" id="sc-${idx}">▼</span>
                </div>
                <div class="collapsible-body" id="sb-${idx}">
                    ${rows.map(r => `
                        <div class="stream-row">
                            <span class="row-label">${r.label}</span>
                            <span class="row-value">${r.value}${r.chip ? ' '+r.chip : ''}</span>
                        </div>
                    `).join('')}
                    ${dispRows.length ? `
                        <div class="section-divider">Disposition Flags</div>
                        <div class="disposition-grid">
                            ${dispRows.map(d => `
                                <div class="disposition-item">
                                    <div class="disposition-dot ${d.active ? 'dot-active' : 'dot-inactive'}"></div>
                                    <span style="color:${d.active ? '#2d3748' : '#a0aec0'};font-weight:${d.active ? '600' : '400'}">${d.key}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    ${tagRows.length ? `
                        <div class="section-divider">Tags</div>
                        ${tagRows.map(r => `
                            <div class="stream-row">
                                <span class="row-label">${r.label}</span>
                                <span class="row-value">${r.value}</span>
                            </div>
                        `).join('')}
                    ` : ''}
                </div>
            </div>
        `;
    }).join('');
}

/* ══════════════════════════════════════════════════════════════════
   ⑤ FORMAT DETAILS (collapsible, default closed)
══════════════════════════════════════════════════════════════════ */
function renderFormatDetails(format) {
    const rows = [];
    const add  = (l,v) => { if (v !== undefined && v !== null) rows.push({ label:l, value:String(v) }); };

    add('Filename',           format.filename);
    add('Number of Streams',  format.nb_streams);
    add('Number of Programs', format.nb_programs);
    add('Format Name',        format.format_name);
    add('Format Long Name',   format.format_long_name);
    add('Start Time',         format.start_time !== undefined ? `${format.start_time} s` : undefined);
    add('Duration',           format.duration   !== undefined ? `${parseFloat(format.duration).toFixed(3)} s` : undefined);
    add('File Size',          format.size  ? formatFileSize(parseInt(format.size))   : undefined);
    add('Bit Rate',           format.bit_rate ? formatBitrate(parseInt(format.bit_rate)) : undefined);
    add('Probe Score',        format.probe_score);

    const tagRows = format.tags ? Object.entries(format.tags).map(([k,v]) => ({ label:toTitleCase(k.replace(/_/g,' ')), value:v })) : [];

    document.getElementById('formatDetailsCard').innerHTML = `
        <div class="format-details-header-bar" onclick="toggleSection('fmt-body','fmt-hdr','fmt-chev')" id="fmt-hdr">
            <div class="collapsible-header-left">
                <span class="collapsible-icon">📁</span>
                <span class="collapsible-title">Format Details</span>
                <span class="stream-badge badge-format">FORMAT</span>
            </div>
            <span class="chevron" id="fmt-chev">▼</span>
        </div>
        <div class="collapsible-body" id="fmt-body">
            ${rows.map(r => `
                <div class="stream-row">
                    <span class="row-label">${r.label}</span>
                    <span class="row-value">${r.value}</span>
                </div>
            `).join('')}
            ${tagRows.length ? `
                <div class="section-divider">Tags</div>
                ${tagRows.map(r => `
                    <div class="stream-row">
                        <span class="row-label">${r.label}</span>
                        <span class="row-value">${r.value}</span>
                    </div>
                `).join('')}
            ` : ''}
        </div>
    `;
}

/* ── Toggle ─────────────────────────────────────────────────── */
function toggleSection(bodyId, headerId, chevId) {
    const body  = document.getElementById(bodyId);
    const hdr   = document.getElementById(headerId);
    const chev  = document.getElementById(chevId);
    const isOpen = body.classList.contains('open');

    if (hdr && hdr.classList.contains('collapsible-header')) {
        hdr.classList.toggle('open', !isOpen);
    }
    body.classList.toggle('open', !isOpen);
    if (chev) {
        chev.textContent = isOpen ? '▼' : '▲';
        chev.classList.toggle('rotated', !isOpen);
    }
}

/* ── View Switch ─────────────────────────────────────────────── */
function switchView(view) {
    document.getElementById('formattedView').style.display = view === 'formatted' ? 'block' : 'none';
    document.getElementById('jsonView').style.display      = view === 'json'      ? 'block' : 'none';
    document.getElementById('formattedBtn').classList.toggle('active', view === 'formatted');
    document.getElementById('jsonBtn').classList.toggle('active', view === 'json');
}

/* ── Build Stream Rows ──────────────────────────────────────── */
function buildStreamRows(stream) {
    const rows = [];
    const validPixFmts = ['yuv420p','yuvj420p'];

    const add = (label, val, chip) => {
        if (val !== undefined && val !== null && val !== '') {
            rows.push({ label, value: String(val), chip: chip || null });
        }
    };

    add('Index',      stream.index);
    add('Codec',      stream.codec_name);
    add('Codec Name', stream.codec_long_name);
    add('Profile',    stream.profile);
    add('Type',       stream.codec_type);
    add('Codec Tag',  stream.codec_tag_string);

    if (stream.codec_type === 'video') {
        const pf = (stream.pix_fmt || '').toLowerCase();
        const pfChip = pf ? (validPixFmts.includes(pf)
            ? `<span class="chip chip-valid">✔ Valid</span>`
            : `<span class="chip chip-error">✖ Not Valid</span>`) : null;
        add('Pixel Format',          stream.pix_fmt, pfChip);
        add('Width',                 stream.width   ? `${stream.width} px`   : undefined);
        add('Height',                stream.height  ? `${stream.height} px`  : undefined);
        add('Coded Width',           stream.coded_width  ? `${stream.coded_width} px`  : undefined);
        add('Coded Height',          stream.coded_height ? `${stream.coded_height} px` : undefined);
        add('Sample Aspect Ratio',   stream.sample_aspect_ratio);
        add('Display Aspect Ratio',  stream.display_aspect_ratio);
        add('Level',                 stream.level);
        add('Color Range',           stream.color_range);
        add('Color Space',           stream.color_space);
        add('Color Transfer',        stream.color_transfer);
        add('Color Primaries',       stream.color_primaries);
        add('Chroma Location',       stream.chroma_location);
        add('Field Order',           stream.field_order);
        add('Has B-Frames',          stream.has_b_frames);
        add('Refs',                  stream.refs);
        add('Is AVC',                stream.is_avc);
    }

    if (stream.codec_type === 'audio') {
        const status = classifyAudioStream(stream);
        let audioChip;
        if      (status === 'valid')    audioChip = `<span class="chip chip-valid">✔ Compatible</span>`;
        else if (status === 'surround') audioChip = `<span class="chip chip-error">✖ Surround Only</span>`;
        else                            audioChip = `<span class="chip chip-warning">? Unknown</span>`;

        add('Audio Codec Name', stream.codec_long_name || stream.codec_name, audioChip);
        add('Sample Rate',      stream.sample_rate  ? `${stream.sample_rate} Hz` : undefined);
        add('Channels',         stream.channels);
        add('Channel Layout',   stream.channel_layout);
        add('Bits Per Sample',  stream.bits_per_sample);
    }

    add('Frame Rate',          stream.r_frame_rate);
    add('Avg Frame Rate',      stream.avg_frame_rate);
    add('Time Base',           stream.time_base);
    add('Start Time',          stream.start_time !== undefined ? `${stream.start_time} s` : undefined);
    add('Duration',            stream.duration   !== undefined ? `${parseFloat(stream.duration).toFixed(3)} s` : undefined);
    add('Duration (ts)',       stream.duration_ts);
    add('Bit Rate',            stream.bit_rate ? formatBitrate(parseInt(stream.bit_rate)) : undefined);
    add('Bits Per Raw Sample', stream.bits_per_raw_sample);
    add('Number of Frames',    stream.nb_frames);
    add('Extradata Size',      stream.extradata_size ? `${stream.extradata_size} bytes` : undefined);
    add('ID',                  stream.id);
    add('NAL Length Size',     stream.nal_length_size);

    return rows;
}

function buildDispositionRows(d) {
    return Object.entries(d).map(([k,v]) => ({ key: toTitleCase(k.replace(/_/g,' ')), active: v === 1 }));
}
function buildTagRows(tags) {
    return Object.entries(tags).map(([k,v]) => ({ label: toTitleCase(k.replace(/_/g,' ')), value: v }));
}

let analyzedVideoUrl = null;





/* ── Utility ─────────────────────────────────────────────────── */
function getStreamIcon(t) { return { video:'🎬', audio:'🎵', subtitle:'📝', data:'📊' }[t] || '📄'; }
function getBadgeClass(t) { return { video:'badge-video', audio:'badge-audio', subtitle:'badge-subtitle', data:'badge-data' }[t] || 'badge-data'; }
function toTitleCase(s)   { return s.replace(/\b\w/g, l => l.toUpperCase()); }

function formatDuration(s) {
    if (isNaN(s)) return '—';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = (s%60).toFixed(1);
    if (h > 0) return `${h}h ${m}m ${sec}s`;
    if (m > 0) return `${m}m ${sec}s`;
    return `${sec}s`;
}
function formatFileSize(bytes) {
    if (isNaN(bytes)||bytes===0) return '—';
    const i = Math.floor(Math.log(bytes)/Math.log(1024));
    return (bytes/Math.pow(1024,i)).toFixed(2)+' '+['Bytes','KB','MB','GB','TB'][i];
}
function formatBitrate(bps) {
    if (isNaN(bps)||bps===0) return '—';
    if (bps>=1000000) return (bps/1000000).toFixed(2)+' Mbps';
    if (bps>=1000)    return (bps/1000).toFixed(0)+' Kbps';
    return bps+' bps';
}
function syntaxHighlight(json) {
    return json.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        m => {
            let c = 'json-number';
            if (/^"/.test(m)) c = /:$/.test(m) ? 'json-key' : 'json-string';
            else if (/true|false/.test(m)) c = 'json-boolean';
            else if (/null/.test(m)) c = 'json-null';
            return `<span class="${c}">${m}</span>`;
        }
    );
}
